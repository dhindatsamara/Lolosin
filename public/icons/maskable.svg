<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Ikon maskable Lolosin v2.2.1: latar full-bleed hijau tua, maskot
       Osi di dalam safe zone 80% (tengah) supaya tidak terpotong mask
       bulat/kotak launcher. Wajah mengikuti Mascot mood 'senang': mata
       lebih kecil dan lembut, senyum lebar yang jelas, pipi merona.
       Versi sebelumnya terlihat melotot di ukuran kecil karena mata
       putih dan pupilnya terlalu besar. -->
  <rect width="512" height="512" fill="#0E5C43"/>
  <g transform="translate(51.2 51.2) scale(0.8)">
    <!-- Badan blob hijau terang -->
    <ellipse cx="256" cy="288" rx="170" ry="160" fill="#2FBF71" stroke="#1B1E1C" stroke-width="16"/>
    <!-- Kilau halus -->
    <ellipse cx="181" cy="213" rx="43" ry="27" fill="#B8F1D1" opacity="0.55" transform="rotate(-20 181 213)"/>
    <!-- Topi wisuda amber -->
    <rect x="192" y="117" width="128" height="48" rx="21" fill="#D97706" stroke="#1B1E1C" stroke-width="13"/>
    <polygon points="256,32 395,91 256,149 117,91" fill="#F59E0B" stroke="#1B1E1C" stroke-width="13" stroke-linejoin="round"/>
    <path d="M395 91 L416 160" stroke="#1B1E1C" stroke-width="13" stroke-linecap="round"/>
    <circle cx="416" cy="170" r="19" fill="#D97706" stroke="#1B1E1C" stroke-width="11"/>
    <!-- Pipi merona -->
    <ellipse cx="139" cy="325" rx="24" ry="17" fill="#FCD34D" opacity="0.8"/>
    <ellipse cx="373" cy="325" rx="24" ry="17" fill="#FCD34D" opacity="0.8"/>
    <!-- Mata lembut: putih lebih kecil, pupil kecil, highlight -->
    <circle cx="192" cy="277" r="30" fill="#FFFFFF" stroke="#1B1E1C" stroke-width="11"/>
    <circle cx="320" cy="277" r="30" fill="#FFFFFF" stroke="#1B1E1C" stroke-width="11"/>
    <circle cx="196" cy="282" r="13" fill="#1B1E1C"/>
    <circle cx="324" cy="282" r="13" fill="#1B1E1C"/>
    <circle cx="205" cy="272" r="6" fill="#FFFFFF"/>
    <circle cx="333" cy="272" r="6" fill="#FFFFFF"/>
    <!-- Senyum lebar yang jelas -->
    <path d="M186 330 Q256 388 326 330" fill="none" stroke="#1B1E1C" stroke-width="17" stroke-linecap="round"/>
  </g>
</svg>
